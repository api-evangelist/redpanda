meters:
  - name: cluster_hours
    description: Per-cluster active-hours billed by tier (Serverless, Dedicated tiers).
    unit: cluster-hour
    aggregation: sum
    dimensions:
      - organization
      - cluster
      - tier
      - region
  - name: ingress_bytes
    description: Bytes produced into Redpanda Cloud (Serverless usage-based component).
    unit: byte
    aggregation: sum
    dimensions:
      - organization
      - cluster
      - tenant
  - name: egress_bytes
    description: Bytes consumed from Redpanda Cloud (cross-AZ / cross-region egress may carry cloud-provider charges).
    unit: byte
    aggregation: sum
    dimensions:
      - organization
      - cluster
      - tenant
      - direction
  - name: partition_count
    description: Total partitions held by the cluster (Serverless / Dedicated quota element).
    unit: partition-month
    aggregation: max
    dimensions:
      - organization
      - cluster
  - name: tiered_storage_gb
    description: Storage used by tiered/object-storage retention.
    unit: gb-month
    aggregation: max
    dimensions:
      - organization
      - cluster
      - storage_class
  - name: privatelink_endpoints
    description: Active AWS PrivateLink / GCP PSC endpoint hours.
    unit: endpoint-hour
    aggregation: sum
    dimensions:
      - organization
      - cluster
      - cloud
  - name: byoc_management_fee
    description: Per-cluster monthly management fee for BYOC deployments (cloud infrastructure billed separately to customer cloud account).
    unit: cluster-month
    aggregation: max
    dimensions:
      - organization
      - cluster
      - tier
  - name: enterprise_license
    description: Self-managed Enterprise annual license, custom-quoted by capacity.
    unit: license-year
    aggregation: max
    dimensions:
      - customer
      - capacity
principles:
  - name: Visibility
    description: >-
      Use the Redpanda Cloud Console for usage and invoice details. For BYOC, pair the Redpanda invoice with cost-allocation tags pulled from the customer's cloud bill (FOCUS-formatted exports from AWS/GCP/Azure cover the underlying infrastructure).
  - name: Allocation
    description: >-
      Tag clusters by environment and business unit; on Cloud Serverless, dedicate clusters per tenant for clean attribution. For self-hosted, tag the underlying compute, EBS volumes, and S3 buckets used for tiered storage.
  - name: Optimization
    description: >-
      Use tiered storage to cut hot-storage cost (8-9x savings claimed); enable compression and right-size partitions; consolidate idle Serverless clusters; consider BYOC for very large workloads to leverage cloud committed-use discounts.
  - name: Accountability
    description: >-
      Assign a cluster owner per environment; review monthly forecast versus invoice; alert on partition-count, ingress-throughput, and tiered-storage growth as leading cost indicators.
