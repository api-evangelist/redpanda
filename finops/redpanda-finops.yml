description: >-
  Redpanda has a hybrid billing surface. The open-source Community Edition (BSL 1.1) generates no Redpanda invoice; cost flows through the operator's own cloud bill (compute, storage, networking). Redpanda Cloud Serverless bills usage-based (no base fee, $100 trial credit). Cloud Dedicated and BYOC are committed/throughput-tier subscriptions with separate charges for tiered storage, networking, and PrivateLink. BYOC additionally produces cloud-provider charges directly to the customer's AWS/GCP/Azure account, with Redpanda only invoicing a management fee. Self-managed Enterprise carries an annual license fee.
notes: >-
  Reconciled at the model level on 2026-05-08. Per-tier hourly rates for Dedicated/BYOC are quoted by Redpanda sales; the customer-facing price-estimator on redpanda.com produces project-specific quotes. No public FOCUS-format usage feed exists; usage data is available via the Cloud Console and contractual usage reports.
sources:
